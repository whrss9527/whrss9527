name: Update app versions

on:
  schedule:
    # every 6 hours; the apps ship often, so a daily refresh would lag
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update the project cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_releases.py

      - name: Commit and push
        run: |
          git add .github/scripts/releases.json assets/cards
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app versions"
          # the poster and blog workflows also push to master
          git pull --rebase
          git push
