name: Update blog posts

on:
  schedule:
    # hourly, half an hour after the blog's own hourly deploy (:23); the README is only
    # committed when the latest posts changed, so the quiet hours leave no trace
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-posts

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update README
        run: python3 .github/scripts/update_blog_posts.py

      - name: Commit and push
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update latest blog posts" README.md
          # the poster and releases workflows also push to master
          git pull --rebase
          git push
